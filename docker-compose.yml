services:
  fyro-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fyro_discord_bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fyro_user:fyro_password@postgres:5432/fyro_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: fyro_postgres
    restart: always
    environment:
      POSTGRES_USER: fyro_user
      POSTGRES_PASSWORD: fyro_password
      POSTGRES_DB: fyro_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fyro_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
